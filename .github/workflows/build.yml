name: Build MECHANIUM

on:
  push:
    branches: [main, "architecture/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Publicar o JAR como GitHub Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          mvn --batch-mode --no-transfer-progress -DskipTests -pl mechanium-api -am install
          mvn --batch-mode --no-transfer-progress -f examples/mechanium-addon-example/pom.xml clean package
      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: MECHANIUM-0.9.9.00-SNAPSHOT
          path: mechanium-plugin/target/MECHANIUM-0.9.9.00-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish MECHANIUM Pre-release
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build distributable JAR
        run: |
          mvn --batch-mode --no-transfer-progress clean package -pl mechanium-plugin -am -DskipTests
      - name: Create or update GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.9.9.00-snapshot
          name: MECHANIUM 0.9.9.00-SNAPSHOT
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          body: |
            Snapshot de testes do MECHANIUM.
            Compilado automaticamente pelo GitHub Actions.
            Esta versão é experimental e ainda precisa de validação em servidor Paper/Purpur.
          files: mechanium-plugin/target/MECHANIUM-*.jar
          overwrite_files: true
          fail_on_unmatched_files: true
