name: Build MECHANIUM

on:
  push:
    branches: [main, "architecture/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload MECHANIUM JAR
        uses: actions/upload-artifact@v4
        with:
          name: MECHANIUM-java21
          path: mechanium-plugin/target/MECHANIUM-*.jar
          if-no-files-found: error
          retention-days: 14
