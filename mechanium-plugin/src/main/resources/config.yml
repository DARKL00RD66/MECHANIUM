storage:
  database: mechanium.db

progression:
  default-era: ancient
  server-era: ancient
  global-era-announcement:
    revision: 0
  starting-research-points: 40
  # Every player research takes at least two minutes. A per-technology override is optional.
  # Default duration = base + (research cost * seconds-per-research-point)
  #                    + (era order * seconds-per-era).
  research:
    minimum-seconds: 120
    base-seconds: 120
    seconds-per-research-point: 3
    seconds-per-era: 15
    overrides: {}
  eras:
    - id: ancient
      name: Antiguidade
      order: 0
    - id: medieval
      name: Idade Média
      order: 1
    - id: renaissance
      name: Renascimento
      order: 2
    - id: industrial_revolution
      name: Revolução Industrial
      order: 3
    - id: electrification
      name: Eletrificação
      order: 4
    - id: modern
      name: Era Moderna
      order: 5
    - id: atomic_age
      name: Era Atômica e do Pós-Guerra
      order: 6
    - id: information_age
      name: Era da Informação
      order: 7
    - id: digital_age
      name: Era Digital
      order: 8
    - id: space_age
      name: Era Espacial
      order: 9
    - id: mythic_age
      name: Era Mítica
      order: 10
    - id: speculative_future
      name: Futuro Especulativo
      order: 11

# Recipe IDs are discovered from Paper's vanilla recipe registry on startup.
# Existing entries are preserved; missing entries receive a suggested historical era.
# The admin HUD can review and change the complete supported catalog page by page.
vanilla-recipe-gates:
  enabled: true
  auto-register: true
  recipes:
    'minecraft:stone_pickaxe': ancient
    'minecraft:iron_pickaxe': medieval
    'minecraft:iron_sword': medieval
    'minecraft:shield': medieval
    'minecraft:bow': medieval
    'minecraft:crossbow': renaissance
    'minecraft:anvil': renaissance
    'minecraft:enchanting_table': mythic_age
    'minecraft:piston': industrial_revolution
    'minecraft:hopper': industrial_revolution
    'minecraft:minecart': industrial_revolution
    'minecraft:rail': industrial_revolution
    'minecraft:dispenser': industrial_revolution
    'minecraft:repeater': electrification
    'minecraft:comparator': electrification
    'minecraft:redstone_lamp': electrification
    'minecraft:observer': modern
    'minecraft:blast_furnace': modern
    'minecraft:smoker': modern
    'minecraft:daylight_detector': modern
    'minecraft:crafter': digital_age

# Reward is granted once per player for the first discovered block of each listed ore type.
research-rewards:
  advancements:
    default: 2
  blocks:
    COAL_ORE: 1
    DEEPSLATE_COAL_ORE: 1
    COPPER_ORE: 2
    DEEPSLATE_COPPER_ORE: 2
    IRON_ORE: 2
    DEEPSLATE_IRON_ORE: 2
    GOLD_ORE: 3
    DEEPSLATE_GOLD_ORE: 3
    REDSTONE_ORE: 2
    DEEPSLATE_REDSTONE_ORE: 2
    LAPIS_ORE: 2
    DEEPSLATE_LAPIS_ORE: 2
    DIAMOND_ORE: 5
    DEEPSLATE_DIAMOND_ORE: 5
    EMERALD_ORE: 5
    DEEPSLATE_EMERALD_ORE: 5
    NETHER_QUARTZ_ORE: 2
    NETHER_GOLD_ORE: 2
    ANCIENT_DEBRIS: 8

modules:
  industry:
    enabled: true
  geology:
    enabled: true
  agriculture:
    enabled: true
  exotic-garden:
    enabled: true
  energy:
    enabled: true
  storage:
    enabled: true
  environment:
    enabled: true
  optional-fantasy:
    enabled: false
  optional-futuristic:
    enabled: false
  culinary:
    enabled: true
  ore-processing:
    enabled: true
  extra-gear:
    enabled: true
  eco-power:
    enabled: true
  sfcalc:
    enabled: true
  liquid:
    enabled: true
  advanced-tech:
    enabled: true
  simple-storage:
    enabled: true
  sensible-toolbox:
    enabled: true
  dank-tech2:
    enabled: true
  electric-spawners:
    enabled: true
  fast-machines:
    enabled: true
  hardcore-slimefun:
    enabled: true
  air-filtration:
    enabled: true
  advanced-metallurgy:
    enabled: true
  pressure-engineering:
    enabled: true
  industrial-automation:
    enabled: true
  industrial-logistics:
