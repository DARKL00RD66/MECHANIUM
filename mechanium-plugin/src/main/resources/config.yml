industrial-networks:
  # Maximum MECHANIUM items moved by one network in each 40-tick transfer cycle.
  # Allowed range: 1..64. Partial transfers return only uninserted items to the source crate.
  items-per-cycle: 16

fluids:
  # Tank storage is measured in millibuckets; 1,000 mB = 1 bucket.
  tank-capacity-mb: 16000
  transfer-mb-per-cycle: 250

greenhouse:
  # A climate controller boosts a compatible crop by one growth stage after a normal growth event.
  growth-radius: 4
  energy-per-growth: 1

slime-customizer:
  # IDs for administrator-created items and recipes. SQLite ownership is kept separately.
  user-item-ids: []
  user-recipe-ids: []

machines:
  # Maximum loaded machine updates executed by the round-robin scheduler every 20 ticks.
  # Allowed range: 1..1024. Machines beyond the budget continue in the next cycle.
  max-updates-per-cycle: 256
  wear:
    enabled: true
    max-cycles: 100
    cycles-per-operation: 1
  # Optional harder rules: more wear per production cycle and more iron for manual repairs.
  hardcore:
    enabled: false
    wear-multiplier: 2
    repair-iron-ingots: 2

addons:
  directory: addons
  api-version: '1'

staff:
  admins: []

# Administrative recipe edits override module/addon definitions without modifying SQLite ownership.
admin-recipe-overrides: {}

# Equivalent exchange. Unlisted items cannot be converted into EMC.
# Values are EMC per single item. Keys may reference vanilla or MECHANIUM items.
emc-exchange:
  values:
    'minecraft:stone': 1
    'minecraft:cobblestone': 1
    'minecraft:dirt': 1
    'minecraft:sand': 1
    'minecraft:gravel': 1
