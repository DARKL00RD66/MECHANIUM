name: Build MECHANIUM

on:
  push:
    branches: [main, "architecture/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: |
          mvn --batch-mode --no-transfer-progress clean verify
          mvn --batch-mode --no-transfer-progress -DskipTests -pl mechanium-api -am install
          mvn --batch-mode --no-transfer-progress -f examples/mechanium-addon-example/pom.xml clean package
      - name: Upload MECHANIUM JAR (optional; GitHub artifact quota may be full)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: MECHANIUM-java21
          path: mechanium-plugin/target/MECHANIUM-*.jar
          if-no-files-found: error
          retention-days: 14
